name: Deploy to GitHub Pages

on:
  # Déploiement à chaque push sur main.
  push:
    branches: [main]
  # Déclenchement manuel depuis l'onglet Actions de GitHub.
  workflow_dispatch:
  # Déclenchement externe : le webhook Sanity appelle l'API GitHub avec
  # event_type « sanity-publish » à chaque publication de contenu, ce qui
  # régénère le site statique avec les dernières données.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
        env:
          # Le site est servi depuis https://marie-garde.github.io/ohayon/
          NUXT_APP_BASE_URL: /ohayon/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
